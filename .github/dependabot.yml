version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Matches min-release-age in .npmrc
    cooldown:
      default-days: 7
  # Keeps actions current, regenerating actions.lock in the same PR
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
